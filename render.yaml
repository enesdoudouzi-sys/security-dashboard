# Render Blueprint für die Scanner-API (Backend).
# In Render:  New +  →  Blueprint  →  dieses Repo wählen  →  Apply.
services:
  - type: web
    name: cybershield-scanner-enes
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Nur diese Ziele dürfen gescannt werden (Komma-getrennt).
      - key: ALLOWED_TARGETS
        value: "scanme.nmap.org,127.0.0.1,localhost,::1"
      # Eigenes Übungsnetz (10./172.16./192.168.) erlauben: auf "1" setzen.
      - key: ALLOW_PRIVATE_RANGES
        value: "0"
      # Kein API-Schlüssel nötig (Schutz übernimmt die Ziel-Freigabeliste oben).
      # Später absichern: hier SCAN_API_KEY ergänzen und im Dashboard eintragen.
