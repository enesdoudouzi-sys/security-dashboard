# Render Blueprint für die Scanner-API (Backend).
# In Render: New + → Blueprint → dieses Repo wählen.
services:
  - type: web
    name: security-dashboard-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Nur diese Ziele dürfen gescannt werden (Komma-getrennt).
      - key: ALLOWED_TARGETS
        value: "scanme.nmap.org,127.0.0.1,localhost,::1"
      # Schlüssel für Scans. In Render auf einen eigenen Wert setzen!
      - key: SCAN_API_KEY
        sync: false
      # Eigenes Übungsnetz (10./172.16./192.168.) erlauben: auf "1" setzen.
      - key: ALLOW_PRIVATE_RANGES
        value: "0"
      # Website-Adressen, die das Backend aufrufen dürfen (Komma-getrennt).
      - key: EXTRA_ORIGINS
        sync: false
